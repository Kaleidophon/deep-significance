dist: xenial
sudo: false
language: python
python:
  - "3.7"

# install uv, then the package plus the dev dependency group
install:
  - curl -LsSf https://astral.sh/uv/install.sh | sh
  - export PATH="$HOME/.local/bin:$PATH"
  - uv sync --python "$(which python)"

script:
  - uv run coverage run --source deepsig/ --omit="*/test*" -m unittest discover deepsig/tests
  - uv run coverage report --skip-covered
  - uv run coveralls
