[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsig"
dynamic = ["version"]
description = "Easy Significance Testing for Deep Neural Networks."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Dennis Ulmer" }]
license = { text = "GPL" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.19.5",
    "scipy>=1.6.0",
    "tqdm>=4.59.0",
    "joblib>=1.0.1",
    "pandas>=1.3.3",
    "dill>=0.3.4",
    "psutil>=5.9.0",
]
keywords = [
    "machine learning",
    "deep learning",
    "reinforcement learning",
    "computer vision",
    "natural language processing",
    "nlp",
    "rl",
    "cv",
    "statistical significance testing",
    "statistical hypothesis testing",
    "significance test",
    "statistical significance",
    "pytorch",
    "tensorflow",
    "numpy",
    "jax",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Kaleidophon/deep-significance"

[dependency-groups]
dev = [
    # Testing (incl. tensor conversion from other frameworks)
    "coverage>=5.5",
    "coveralls>=3.0.1",
    "jax>=0.2.9",
    "tensorflow>=2.4.1",
    "torch>=1.8.0",
    # Documentation
    "m2r>=0.2.1",
    "mistune==0.8.4",
    "numpydoc>=1.1.0",
    "readme2tex>=0.0.1b2",
    "recommonmark>=0.7.1",
    "sphinxbootstrap4theme>=0.6.0",
    "sphinxemoji>=0.1.8",
]

[tool.setuptools.dynamic]
# Single source of truth for the version: deepsig/__init__.py
version = { attr = "deepsig.__version__" }

[tool.setuptools.packages.find]
exclude = ["docs*", "dist*", "paper*", "img*", "svgs*"]
